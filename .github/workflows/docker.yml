name: Publish project using Docker

on:
  push:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - 'backend/**'
      - 'frontend/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.meta.outputs.tags }}
            
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.meta.outputs.tags }}

  deploy-to-server:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: setup ssh key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/server_key
          chmod 600 ~/.ssh/server_key
        
      - name: prepare server
        run: |
          ssh -i "~/.ssh/server_key" "${{ secrets.SSH_HOST }}"
          mkdir ~/frontend
          mkdir ~/backend

      - name: pull backend
        run: |
          ssh -i "~/.ssh/server_key" "${{ secrets.SSH_HOST }}"
          "cd ~/backend &&
           docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest
           && docker stop backend || true 
           && docker rm backend || true 

      - name: pull frontend
        run: |
          ssh -i "~/.ssh/server_key" "${{ secrets.SSH_HOST }}"
          "cd ~/frontend &&
           docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest
           && docker stop frontend || true
           && docker rm frontend || true

      - name: copy and run docker compose
        run: |
          scp docker-compose.yml "${{ secrets.SSH_HOST }}:~/docker-compose.yml"
          ssh -i "${{ secrets.SSH_KEY }}" "${{ secrets.SSH_HOST }}" "cd ~ && docker compose -f docker-compose.yml up -d"        
